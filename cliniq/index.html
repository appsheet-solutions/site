<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. Meta refresh for standard browser redirection (0 seconds delay) -->
    <meta http-equiv="refresh" content="0; url=https://calendar.app.google/piaz75b6EBA6LTaw8">
    
    <!-- 2. Canonical tag so search engines credit the destination URL -->
    <link rel="canonical" href="https://calendar.app.google/piaz75b6EBA6LTaw8" />
    
    <title>Redirecting...</title>

    <!-- 3. JavaScript redirect for immediate execution -->
    <script>
        window.location.href = "https://calendar.app.google/piaz75b6EBA6LTaw8";
    </script>
</head>
<body>
    <!-- 4. Fallback link in case JavaScript / Meta refresh is blocked -->
    <p>Redirecting to calendar... If you are not redirected automatically, <a href="https://calendar.app.google/piaz75b6EBA6LTaw8">click here</a>.</p>
</body>
</html>
